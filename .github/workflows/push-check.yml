name: Push Check

on:
  push:
    branches: [main]

jobs:
  verify:
    name: Verify Main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --legacy-peer-deps

      - run: npx tsc --noEmit

      - run: npx jest --ci --forceExit
